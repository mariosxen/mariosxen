<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Marios Xenofontos · IT Systems Administrator II · DevSecOps focus">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#2a3a55"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#0f1b30"/><stop offset="1" stop-color="#13213a"/></linearGradient>
    <style>
      .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .m{font-family:'JetBrains Mono',Consolas,'SF Mono',Menlo,monospace}
      .cur{animation:b 1.1s steps(2) infinite}@keyframes b{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.cur{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#fade)"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)" opacity=".55"/>
  <!-- terminal mark -->
  <rect x="70" y="86" width="92" height="92" rx="20" fill="#1b2d4d" stroke="#2f4670"/>
  <path d="M94 113 L114 132 L94 151" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="cur" x="122" y="142" width="24" height="9" rx="3" fill="#f59e0b"/>
  <text x="196" y="128" class="t" font-size="50" font-weight="800" fill="#ffffff">Marios Xenofontos</text>
  <text x="198" y="170" class="t" font-size="23" font-weight="600" fill="#cbd5e1">IT Systems Administrator II  <tspan fill="#f59e0b">·  DevSecOps focus</tspan></text>
  <text x="198" y="206" class="m" font-size="16" fill="#8ea3c3">$ build with AI → secure → ship via CI/CD → run on Cloudflare</text>
  <!-- status chips -->
  <g class="m" font-size="13">
    <rect x="860" y="70" width="270" height="34" rx="17" fill="#13324a" stroke="#1f5f7a"/><circle cx="880" cy="87" r="5" fill="#34d399"/><text x="894" y="92" fill="#d1fae5">6 apps live on Cloudflare</text>
    <rect x="860" y="114" width="270" height="34" rx="17" fill="#2a2140" stroke="#5b3f8c"/><circle cx="880" cy="131" r="5" fill="#a78bfa"/><text x="894" y="136" fill="#ede9fe">Zero Trust on every app</text>
    <rect x="860" y="158" width="270" height="34" rx="17" fill="#3a2a12" stroke="#8a5a14"/><circle cx="880" cy="175" r="5" fill="#f59e0b"/><text x="894" y="180" fill="#fef3c7">Semgrep · Gitleaks · Dependabot</text>
  </g>
  <text x="198" y="250" class="m" font-size="14" fill="#5f7697">Larnaca, Cyprus  ·  mxenofontos.com</text>
</svg>
